name: release-fork-windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the installer.
        required: true
        type: string
        default: open-open-design-v0.18.1
      release_version:
        description: Version baked into the Windows package.
        required: true
        type: string
        default: 0.18.1

permissions:
  contents: write

concurrency:
  group: open-open-design-windows-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    env:
      OD_PACKAGED_PRODUCT_NAME: Open Open Design
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup NSIS
        shell: pwsh
        run: |
          # windows-latest does not guarantee a preinstalled NSIS, and the
          # Chocolatey feed flakes, so retry and hard-fail here rather than
          # letting the build die on makensis half an hour later.
          function Test-Makensis {
            [bool]((Get-Command makensis.exe -ErrorAction SilentlyContinue) -or (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe"))
          }
          if (Test-Makensis) { Write-Host "makensis already present"; exit 0 }
          foreach ($attempt in 1..4) {
            Write-Host "choco install nsis (attempt $attempt)"
            choco install nsis -y --no-progress
            if (Test-Makensis) { break }
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Test-Makensis)) {
            Write-Error "NSIS install failed after 4 attempts: makensis absent from PATH and C:\Program Files (x86)\NSIS"
            exit 1
          }
          Write-Host "NSIS ready"

      - name: Build unsigned NSIS installer
        id: build
        shell: bash
        run: |
          set -euo pipefail
          build_json="$RUNNER_TEMP/win-tools-pack-build.json"
          build_output="$(pnpm exec tools-pack win build \
            --dir "$RUNNER_TEMP/tools-pack" \
            --namespace open-open-design \
            --portable \
            --app-version "${{ inputs.release_version }}" \
            --to nsis \
            --json)"
          printf '%s\n' "$build_output" | tee "$build_json"
          installer_path="$(jq -r '.installerPath // empty' "$build_json")"
          if [ -z "$installer_path" ] || [ ! -f "$installer_path" ]; then
            echo "tools-pack did not produce an installer: $installer_path" >&2
            exit 1
          fi
          unpacked_path="$(jq -r '.unpackedPath // empty' "$build_json")"
          if [ -z "$unpacked_path" ] || [ ! -d "$unpacked_path" ]; then
            echo "tools-pack did not report an unpacked build: $unpacked_path" >&2
            exit 1
          fi
          asset_dir="$RUNNER_TEMP/release-assets"
          asset_name="open-open-design-${{ inputs.release_version }}-win-x64-setup.exe"
          mkdir -p "$asset_dir"
          cp "$installer_path" "$asset_dir/$asset_name"
          (cd "$asset_dir" && sha256sum "$asset_name" > "$asset_name.sha256")
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "unpacked_path=$unpacked_path" >> "$GITHUB_OUTPUT"

      # A baked namespaceBaseRoot is exactly the non-portable defect this
      # workflow exists to prevent, so fail before the asset can be published.
      - name: Verify packaged identity is portable
        shell: bash
        run: |
          set -euo pipefail
          config="${{ steps.build.outputs.unpacked_path }}/resources/open-design-config.json"
          test -f "$config"
          cat "$config"
          test "$(jq -r '.appVersion' "$config")" = "${{ inputs.release_version }}"
          test "$(jq -r '.productName' "$config")" = "Open Open Design"
          test "$(jq -r '.namespace' "$config")" = "open-open-design"
          if [ "$(jq -r 'has("namespaceBaseRoot")' "$config")" != "false" ]; then
            echo "packaged config baked namespaceBaseRoot; build was not portable" >&2
            exit 1
          fi
          # electron-builder pins executableName to the canonical product name,
          # so the binary stays "Open Design.exe" even under a custom productName.
          test -f "${{ steps.build.outputs.unpacked_path }}/Open Design.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: open-open-design-win-x64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer to existing prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "${{ inputs.release_tag }}" \
            "$RUNNER_TEMP/release-assets"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Open Open Design Windows package"
            echo
            echo "- release: ${{ inputs.release_tag }}"
            echo "- version: ${{ inputs.release_version }}"
            echo "- product: Open Open Design"
            echo "- packages: x64 NSIS installer"
            echo "- portable: yes (no namespaceBaseRoot baked into packaged config)"
            echo "- signing: unsigned"
          } >> "$GITHUB_STEP_SUMMARY"
